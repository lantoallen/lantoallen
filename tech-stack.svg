<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 336" width="100%" height="100%" style="max-width: 850px;">
  <defs>
    <style>
      .bg { fill: #0D1117; }
      .mono { font-family: 'Space Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,'Courier New',monospace; }
      .title { font-family: 'Space Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,'Courier New',monospace; fill: #8b949e; font-size: 12px; letter-spacing: 1px; }
      .cat { font-family: 'Space Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,'Courier New',monospace; fill: #FFB8D1; font-size: 12px; font-weight: bold; letter-spacing: 1.5px; }
      .pill-text { font-family: 'Space Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,'Courier New',monospace; font-size: 11px; font-weight: bold; letter-spacing: 0.3px; }
      @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      .pill { animation: pop 0.5s ease-out both; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      .cursor { animation: blink 1.2s steps(1) infinite; }
    </style>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB8D1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#E6CCFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB8D1"/>
      <stop offset="0.5" stop-color="#E6CCFF"/>
      <stop offset="1" stop-color="#8be9fd"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E6CCFF" stroke-width="0.5" stroke-opacity="0.05"/>
    </pattern>
  </defs>

