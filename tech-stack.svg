<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 310" width="100%" height="100%" style="max-width: 850px;">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&amp;display=swap');
            .bg { fill: #0D1117; }
            .category-title { font-family: 'Space Mono', monospace; fill: #FFB8D1; font-size: 13px; font-weight: bold; letter-spacing: 1px; }
            .pill-text { font-family: 'Space Mono', monospace; font-size: 11px; font-weight: bold; }
        </style>
        <pattern id="grid-tech" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E6CCFF" stroke-width="0.5" stroke-opacity="0.04"/>
        </pattern>
    </defs>

    <!-- Card Background with Neon Pink Glow Border -->
    <rect width="100%" height="100%" rx="12" class="bg" />
    <rect width="100%" height="100%" fill="url(#grid-tech)" rx="12" />
    <rect x="10" y="10" width="830" height="290" rx="8" fill="none" stroke="#FFB8D1" stroke-width="2" filter="drop-shadow(0 0 6px rgba(255, 184, 209, 0.3))" />

    <!-- Section 1: Languages -->
    <g transform="translate(35, 45)">
        <text x="0" y="15" class="category-title">&gt; LANGUAGES</text>
        <!-- JavaScript -->
        <g transform="translate(180, 0)">
            <rect width="115" height="26" rx="6" fill="#21262d" stroke="#F7DF1E" stroke-width="1"/>
            <text x="57" y="17" fill="#F7DF1E" text-anchor="middle" class="pill-text">JAVASCRIPT</text>
        </g>
        <!-- Python -->
        <g transform="translate(305, 0)">
            <rect width="95" height="26" rx="6" fill="#21262d" stroke="#3776AB" stroke-width="1"/>
            <text x="47" y="17" fill="#3776AB" text-anchor="middle" class="pill-text">PYTHON</text>
        </g>
        <!-- Java -->
        <g transform="translate(410, 0)">
            <rect width="80" height="26" rx="6" fill="#21262d" stroke="#ED8B00" stroke-width="1"/>
            <text x="40" y="17" fill="#ED8B00" text-anchor="middle" class="pill-text">JAVA</text>
        </g>
        <!-- HTML5 -->
        <g transform="translate(500, 0)">
            <rect width="85" height="26" rx="6" fill="#21262d" stroke="#E34F26" stroke-width="1"/>
            <text x="42" y="17" fill="#E34F26" text-anchor="middle" class="pill-text">HTML5</text>
        </g>
        <!-- CSS3 -->
        <g transform="translate(595, 0)">
            <rect width="80" height="26" rx="6" fill="#21262d" stroke="#1572B6" stroke-width="1"/>
            <text x="40" y="17" fill="#1572B6" text-anchor="middle" class="pill-text">CSS3</text>
        </g>
    </g>

    <!-- Section 2: Frontend & UI/UX -->
    <g transform="translate(35, 115)">
        <text x="0" y="15" class="category-title">&gt; FRONTEND &amp; UI/UX</text>
        <!-- React -->
        <g transform="translate(180, 0)">
            <rect width="90" height="26" rx="6" fill="#21262d" stroke="#61DAFB" stroke-width="1"/>
            <text x="45" y="17" fill="#61DAFB" text-anchor="middle" class="pill-text">REACT</text>
        </g>
        <!-- Figma -->
        <g transform="translate(280, 0)">
            <rect width="90" height="26" rx="6" fill="#21262d" stroke="#F24E1E" stroke-width="1"/>
            <text x="45" y="17" fill="#F24E1E" text-anchor="middle" class="pill-text">FIGMA</text>
        </g>
    </g>

    <!-- Section 3: Backend & APIs -->
    <g transform="translate(35, 185)">
        <text x="0" y="15" class="category-title">&gt; BACKEND &amp; APIs</text>
        <!-- Express.js -->
        <g transform="translate(180, 0)">
            <rect width="110" height="26" rx="6" fill="#21262d" stroke="#E6CCFF" stroke-width="1"/>
            <text x="55" y="17" fill="#E6CCFF" text-anchor="middle" class="pill-text">EXPRESS.JS</text>
        </g>
    </g>

    <!-- Section 4: Cloud & Data -->
    <g transform="translate(35, 255)">
        <text x="0" y="15" class="category-title">&gt; CLOUD &amp; DATA</text>
        <!-- Supabase -->
        <g transform="translate(180, 0)">
            <rect width="105" height="26" rx="6" fill="#21262d" stroke="#3ECF8E" stroke-width="1"/>
            <text x="52" y="17" fill="#3ECF8E" text-anchor="middle" class="pill-text">SUPABASE</text>
        </g>
    </g>
</svg>
