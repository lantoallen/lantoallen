<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" style="max-width:850px">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .ring { transform-origin: 90px 100px; animation: spin 40s linear infinite; }
    .dot  { animation: pulse 2.4s ease-in-out infinite; }
    .fade { opacity: 0; animation: fade .7s ease-out forwards; }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  </style>

  <!-- Avatar -->
  <circle cx="90" cy="100" r="52" fill="#F6F8FA" stroke="#D0D7DE"/>
  <circle cx="90" cy="100" r="64" fill="none" stroke="#D6457E" stroke-opacity=".7" stroke-width="1.5" stroke-dasharray="2 9" stroke-linecap="round" class="ring"/>
  <text x="90" y="110" text-anchor="middle" class="sans" font-size="28" font-weight="600" fill="#D6457E">AL</text>

  <!-- Text -->
  <g class="fade">
    <text x="190" y="60" class="mono" font-size="13" fill="#8C959F">~/allen</text>
    <text x="190" y="102" class="sans" font-size="34" font-weight="600" fill="#1F2328">Allen Lanto</text>
    <text x="190" y="132" class="sans" font-size="15" fill="#656D76">Computer Science Student · Aspiring Full-Stack Developer</text>
  </g>
  <g class="fade" style="animation-delay:.3s">
    <circle cx="195" cy="161" r="4" fill="#D6457E" class="dot"/>
    <text x="208" y="165" class="mono" font-size="13" fill="#8957C9">building one project at a time</text>
  </g>
</svg>
